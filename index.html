<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L'Open Space de Laurence</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9E3D3;--card:#FFFDF7;--ink:#2C2620;--soft:#6B6255;--accent:#3E6259;--accent-d:#2C4A42;--alert:#C1443C;--line:#DCD3BE;--door:#8A5A3B;--door-d:#6B4128}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1C18;--card:#2B2722;--ink:#F1EBDD;--soft:#B3A993;--accent:#6E9C8E;--accent-d:#4F7A6D;--line:#3A352E}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2',ui-rounded,system-ui,sans-serif}
body{min-height:100vh}
.wrap{width:min(100% - 32px,980px);margin:0 auto}
header{display:flex;align-items:center;gap:22px;padding:40px 0 26px;flex-wrap:wrap}
.door{position:relative;flex:none;width:84px;height:116px;background:var(--door);border:6px solid var(--door-d);border-radius:6px 6px 0 0}
.door::before{content:"LAURENCE";position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#FFFDF7;color:#2C2620;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px}
.door::after{content:"";position:absolute;right:8px;top:62px;width:8px;height:8px;border-radius:50%;background:#F2C94C;animation:tremble 3.2s infinite}
@keyframes tremble{0%,86%,100%{transform:translateX(0)}88%{transform:translateX(-2px)}90%{transform:translateX(2px)}92%{transform:translateX(-2px)}94%{transform:translateX(2px)}}
h1{margin:0;font-size:clamp(32px,6vw,54px);line-height:1;font-weight:800;color:var(--accent)}
h1 span{color:var(--alert)}
.sub{margin:8px 0 0;font-size:17px;color:var(--soft);max-width:520px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.bar h2{margin:0;font-size:20px}.bar small{color:var(--soft);font-weight:600}
.rand{font:inherit;font-weight:700;color:var(--accent);background:transparent;border:2px solid var(--accent);border-radius:999px;padding:5px 18px;cursor:pointer}
.rand:hover{background:var(--accent);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 18px 16px;color:inherit;text-decoration:none;box-shadow:0 5px 0 var(--line);transition:transform .12s,box-shadow .12s,border-color .12s}
a.card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 8px 0 var(--c)}
a.card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--c)}
.ico{display:grid;place-items:center;width:62px;height:62px;border-radius:16px;font-size:34px;background:color-mix(in srgb,var(--c) 16%,transparent);margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:22px;line-height:1.1}
.card p{margin:0 0 14px;font-size:14.5px;line-height:1.4;color:var(--soft);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags span{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--line);color:var(--soft)}
.cta{font-weight:800;color:var(--c)}
.card.soon{border-style:dashed;box-shadow:none;opacity:.72}
.card.soon .ico{filter:grayscale(1)}
.card.soon .cta{color:var(--soft)}
footer{margin:34px 0 40px;padding:16px 18px;border-left:5px solid var(--alert);background:var(--card);border-radius:0 12px 12px 0;color:var(--soft);font-style:italic}
footer b{display:block;font-style:normal;font-size:11px;letter-spacing:.06em;color:var(--alert);margin-bottom:2px}
</style></head>
<body>
<div class="wrap">
  <header>
    <div class="door" aria-hidden="true"></div>
    <div>
      <h1>L'Open Space<br>de <span>Laurence</span></h1>
      <p class="sub">Des mini-jeux sur un seul thème : faire du bruit sans que le manager sorte de son bureau.</p>
    </div>
  </header>

  <div class="bar">
    <h2>Les mini-jeux <small id="count"></small></h2>
    <button class="rand" id="rand">🎲 Au hasard</button>
  </div>
  <main class="grid" id="grid"></main>

  <footer><b>LAURENCE DIT</b><span id="quote"></span></footer>
</div>

<script>
// Pour ajouter un mini-jeu : copier un objet ci-dessous. status "ready" = jouable (file = fichier HTML), "soon" = bientôt.
const GAMES=[
  {title:"Chut y'a Laurence",emoji:"🤫",color:"#3E6259",file:"chut-y-a-laurence.html",status:"ready",
   desc:"Calme les collègues bruyants avant que la jauge de bruit n'explose et que la porte s'ouvre.",tags:["Réflexes","Souris","~3 min"]},
  {title:"Manager Dodge",emoji:"🏃",color:"#C1443C",file:"manager-dodge.html",status:"ready",
   desc:"Papote autant que possible, mais retombe dans le calme quand la poignée de Laurence tremble.",tags:["Esquive","Clavier / clic","~5 min"]},
  {title:"Le Simulateur d'Openspace",emoji:"📈",color:"#D98B3F",status:"soon",
   desc:"Un idle game : monte la productivité bruyante de l'équipe sans dépasser la tolérance de Laurence.",tags:["Idle / clicker"]},
  {title:"Qui a réveillé Laurence ?",emoji:"🎉",color:"#6E8F7C",status:"soon",
   desc:"Party game à plusieurs : le plus bruyant au moment où Laurence sort a perdu.",tags:["Multijoueur","Pause déj"]}
];
const QUOTES=["Est-ce que c'est possible de parler moins fort ?","On dirait une cour de récré ici.","Je vous entends depuis mon bureau.","Ce n'est pas un plateau télé, ici.","Il y en a qui essaient de bosser, hein."];

const grid=document.getElementById('grid');
const mk=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;n.textContent=x;return n};
GAMES.forEach(g=>{
  const ok=g.status=='ready',el=document.createElement(ok?'a':'div');
  el.className='card'+(ok?'':' soon');
  el.style.setProperty('--c',g.color);
  if(ok)el.href=g.file;
  const tags=mk('div','tags');g.tags.forEach(t=>tags.append(mk('span','',t)));
  el.append(mk('div','ico',g.emoji),mk('h3','',g.title),mk('p','',g.desc),tags,mk('div','cta',ok?'Jouer →':'Bientôt…'));
  grid.append(el);
});
const ready=GAMES.filter(g=>g.status=='ready');
document.getElementById('count').textContent='· '+ready.length+' jouable'+(ready.length>1?'s':'')+', '+(GAMES.length-ready.length)+' en préparation';
document.getElementById('rand').onclick=()=>{location.href=ready[Math.floor(Math.random()*ready.length)].file};
document.getElementById('quote').textContent='« '+QUOTES[Math.floor(Math.random()*QUOTES.length)]+' »';
</script>
</body></html>
